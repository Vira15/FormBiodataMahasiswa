<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Akademik</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="landing-page">

        <div class="landing-card">

            <div class="logo">🎓</div>

            <h1>Aplikasi Akademik</h1>

            <p class="subtitle">
                Sistem Pengelolaan Data Mahasiswa dan Dosen
            </p>

            <p class="instruction">
                Silakan pilih jenis pengguna untuk melanjutkan
            </p>

            <div class="role-container">

                <a href="mahasiswa.html" class="role-card">
                    <div class="role-icon">👩‍🎓</div>
                    <h2>Mahasiswa</h2>
                    <p>
                        Kelola biodata, nilai dan hitung IPK
                    </p>
                    <span class="role-button">
                        Masuk sebagai Mahasiswa →
                    </span>
                </a>

                <a href="dosen.html" class="role-card">
                    <div class="role-icon">👨‍🏫</div>
                    <h2>Dosen</h2>
                    <p>
                        Kelola data dan input nilai mahasiswa
                    </p>
                    <span class="role-button">
                        Masuk sebagai Dosen →
                    </span>
                </a>

            </div>

            <footer>
                <p>© 2026 Aplikasi Akademik</p>
            </footer>

        </div>

    </div>

</body>
</html>
